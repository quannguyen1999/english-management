[tool.poetry]
name = "eng-be-ai"
version = "0.1.0"
description = "English Management AI Backend with Flask and AI integration"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "controller"}, {include = "service"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
flask = "^3.1.1"
flask-restful = "^0.3.10"
flask-sqlalchemy = "^3.1.1"
requests = "^2.32.4"
python-dotenv = "^1.0.0"
chromadb = ">=0.6.0"
numpy = "^2.0.0"
torch = "^2.8.0"
transformers = "^4.56.1"
scipy = "^1.16.2"
datasets = "^4.1.1"
edge-tts = ">=6.1.0"
deep-translator = "^1.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
flake8 = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "main:app" 